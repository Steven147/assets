<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Assets Catalog</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  h1 { text-align: center; color: #e94560; margin-bottom: 10px; }
  .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 25px; }
  .toolbar { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .toolbar button {
    background: #0f3460; color: #e94560; border: 1px solid #e94560; padding: 8px 20px;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
    transition: all 0.2s;
  }
  .toolbar button:hover { background: #e94560; color: #fff; }
  .toolbar .default-link {
    background: #0f3460; color: #6a9fb5; border: 1px solid #1b3a5c; padding: 8px 20px;
    border-radius: 8px; font-size: 13px; text-decoration: none; font-family: 'SF Mono', 'Fira Code', monospace;
    display: inline-flex; align-items: center; transition: all 0.2s;
  }
  .toolbar .default-link:hover { background: #1b3a5c; color: #e94560; border-color: #e94560; }
  h2 {
    color: #0f3460; background: #e94560; padding: 10px 20px; border-radius: 8px;
    margin: 25px 0 15px; display: flex; justify-content: space-between; align-items: center;
  }
  h2 .count { font-size: 13px; opacity: 0.8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card {
    background: #16213e; border-radius: 12px; overflow: hidden;
    border: 1px solid #0f3460; transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,69,96,0.15); }
  .card img {
    width: 100%; height: 120px; object-fit: contain; background: #0a0a1a;
    padding: 8px; display: block; cursor: zoom-in;
  }
  .card .info { padding: 10px 14px; }
  .card .filename {
    font-size: 12px; color: #6a9fb5; word-break: break-all; margin-bottom: 6px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .card .desc-edit {
    width: 100%; min-height: 36px; padding: 6px 8px; font-size: 13px; color: #ccc;
    background: #0d1b2a; border: 1px solid #1b3a5c; border-radius: 6px;
    line-height: 1.4; resize: vertical; font-family: inherit;
  }
  .card .desc-edit:focus { outline: none; border-color: #e94560; }
  .badge {
    display: inline-block; background: #0f3460; color: #e94560; padding: 2px 8px;
    border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 6px;
  }
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #16213e; color: #4ade80; border: 1px solid #4ade80;
    padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<h1>🎮 Game Assets Catalog</h1>
<p class="subtitle">Click description to edit · Click image to zoom · Click Save to export JSON</p>
<div class="toolbar">
  <button onclick="saveJson()">💾 Save to JSON</button>
  <button onclick="importJson()">📂 Import JSON</button>
  <a class="default-link" href="assets_map_check.json" target="_blank">🔗 assets_map_check.json</a>
  <input type="file" id="jsonFileInput" accept=".json" style="display:none">
</div>
<div id="catalog"></div>
<div class="toast" id="toast"></div>

<script>
let assetsData = [];

function getCategory(item) {
  const f = item.file;
  if (f.includes('char_')) return 'Characters';
  if (f.includes('Preview') || f.includes('Sample')) return 'Preview/Sample';
  if (f.includes('Ships')) return 'Ships';
  if (f.includes('Tiles')) return 'Tiles';
  return 'Other';
}

function render() {
  const container = document.getElementById('catalog');
  const groups = {};

  assetsData.forEach((item, idx) => {
    const cat = getCategory(item);
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push({ ...item, _idx: idx });
  });

  let html = '';
  for (const [cat, items] of Object.entries(groups)) {
    html += `<h2>${cat} <span class="count">${items.length} items</span></h2>`;
    html += '<div class="grid">';
    items.forEach(item => {
      const fname = item.file.split('/').pop();
      const relPath = item.file.replace('/Users/lsq/env/assets/game/', '');
      html += `
        <div class="card">
          <img src="${relPath}" alt="${fname}" onclick="zoomImg(this)">
          <div class="info">
            <div class="badge">${cat}</div>
            <div class="filename">${fname}</div>
            <textarea class="desc-edit" data-idx="${item._idx}" oninput="markDirty(this)">${item.description}</textarea>
          </div>
        </div>`;
    });
    html += '</div>';
  }
  container.innerHTML = html;
}

function zoomImg(img) {
  if (img.dataset.zoomed === 'true') {
    img.style.height = '120px';
    img.style.objectFit = 'contain';
    img.style.cursor = 'zoom-in';
    img.dataset.zoomed = 'true' === 'false'; // noop guard
    img.dataset.zoomed = 'false';
  } else {
    img.style.height = 'auto';
    img.style.objectFit = 'unset';
    img.style.cursor = 'zoom-out';
    img.dataset.zoomed = 'true';
  }
}

function markDirty(el) {
  const idx = parseInt(el.dataset.idx);
  assetsData[idx].description = el.value;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function saveJson() {
  const json = JSON.stringify(assetsData, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'assets_map_check.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ JSON saved!');
}

function importJson() {
  document.getElementById('jsonFileInput').click();
}

document.getElementById('jsonFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      assetsData = JSON.parse(ev.target.result);
      render();
      showToast('✅ JSON imported!');
    } catch(err) {
      showToast('❌ Invalid JSON');
    }
  };
  reader.readAsText(file);
});

// Auto-load assets_map_check.json on page load (no embedded default).
fetch('assets_map_check.json')
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(data => { assetsData = data; render(); })
  .catch(err => {
    document.getElementById('catalog').innerHTML =
      '<p style="text-align:center;color:#888;padding:40px">' +
      'No data loaded. Click <b>📂 Import JSON</b> or place ' +
      '<code>assets_map_check.json</code> next to this file.<br>' +
      '<small>(fetch error: ' + err + ' — file:// may block fetch; ' +
      'serve via <code>python3 -m http.server</code>)</small></p>';
  });
</script>
</body>
</html>
